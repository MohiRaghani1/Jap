<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020617" />
  <title>Naam Jap Voice Counter</title>

  <style>
    :root {
      --bg1: #fdf6e3;
      --bg2: #f0f0f0;
      --card-bg: #ffffff;
      --text: #111827;
      --subtext: #6b7280;
      --border: rgba(0, 0, 0, 0.14);
      --pill-bg: #f3f4ff;
      --pill-text: #4b5563;
      --transcript-bg: #f9fafb;
      --transcript-border: rgba(148, 163, 184, 0.85);
      --btn-ghost-bg: #f3f4f6;
      --btn-ghost-text: #374151;
      --reset-bg: #fee2e2;
      --reset-text: #b91c1c;
      --stop-bg: #ffedd5;
      --stop-text: #c2410c;
      --shadow-main: 0 18px 40px rgba(0, 0, 0, 0.08);
      --shadow-outline: 0 0 0 1px rgba(0, 0, 0, 0.03);
    }

    body.dark {
      --bg1: #020617;
      --bg2: #020617;
      --card-bg: #020617;
      --text: #e5e7eb;
      --subtext: #9ca3af;
      --border: rgba(148, 163, 184, 0.5);
      --pill-bg: #020617;
      --pill-text: #e5e7eb;
      --transcript-bg: #020617;
      --transcript-border: rgba(75, 85, 99, 0.9);
      --btn-ghost-bg: #020617;
      --btn-ghost-text: #e5e7eb;
      --reset-bg: #451a1a;
      --reset-text: #fecaca;
      --stop-bg: #431407;
      --stop-text: #fed7aa;
      --shadow-main: 0 18px 40px rgba(15, 23, 42, 0.8);
      --shadow-outline: 0 0 0 1px rgba(148, 163, 184, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      padding: 20px;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: var(--shadow-main), var(--shadow-outline);
      padding: 24px 22px 20px;
      position: relative;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .title {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .theme-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 0.78rem;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--subtext);
    }

    .subtitle {
      font-size: 0.8rem;
      text-align: left;
      color: var(--subtext);
      margin-bottom: 18px;
    }

    .field-label {
      font-size: 0.82rem;
      margin-bottom: 4px;
      color: var(--text);
      font-weight: 500;
    }

    .input,
    select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 11px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      outline: none;
      background: transparent;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    select option {
      color: #111827;
      background: #ffffff;
    }

    .input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3);
      background: rgba(15, 23, 42, 0.02);
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      background: var(--pill-bg);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--pill-text);
      margin-bottom: 4px;
    }

    .pill-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #22c55e;
      animation: pulse 1.4s infinite;
    }

    .pill-error {
      background: #fee2e2;
      color: #b91c1c;
    }

    body.dark .pill-error {
      background: #451a1a;
      color: #fecaca;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      60% {
        transform: scale(1.5);
        opacity: 0;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .count-box {
      margin: 12px 0 14px;
      text-align: center;
    }

    .count-label {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 4px;
    }

    .count-value {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }

    .count-note {
      font-size: 0.72rem;
      color: var(--subtext);
      margin-top: 5px;
      word-break: break-word;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 999px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.05s ease, box-shadow 0.1s ease,
        background 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn:disabled {
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.45);
    }

    .btn-primary.disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    .btn-secondary {
      flex: 0 0 auto;
      padding-inline: 12px;
      font-size: 0.8rem;
      background: var(--reset-bg);
      color: var(--reset-text);
    }

    .btn-stop {
      flex: 0 0 auto;
      padding-inline: 12px;
      font-size: 0.8rem;
      background: var(--stop-bg);
      color: var(--stop-text);
    }

    .status {
      font-size: 0.78rem;
      color: var(--pill-text);
      margin-bottom: 8px;
      min-height: 18px;
    }

    .status-error {
      color: #ef4444;
    }

    .transcript-box {
      border-radius: 12px;
      background: var(--transcript-bg);
      border: 1px dashed var(--transcript-border);
      padding: 8px 9px;
      font-size: 0.8rem;
      color: var(--pill-text);
      max-height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
      min-height: 38px;
    }

    .transcript-placeholder {
      color: var(--subtext);
      font-style: italic;
    }

    .tagline {
      text-align: center;
      font-size: 0.72rem;
      color: var(--subtext);
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px 16px 16px;
        border-radius: 18px;
      }

      .title {
        font-size: 1.15rem;
      }

      .count-value {
        font-size: 2.7rem;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="title-row">
      <div class="title">Naam Jap Voice Counter</div>

      <button id="themeToggle" class="theme-btn" type="button">
        🌙 Dark
      </button>
    </div>

    <div class="subtitle">
      Mic se jo naam bologe, wahi count hoga 📿
    </div>

    <div class="row">
      <div style="flex: 1 1 100%;">
        <div class="field-label">
          Jap / Naam comma se alag-alag likhein
        </div>

        <input
          id="mantraInput"
          class="input"
          type="text"
          value="ram, raam"
          placeholder="Jaise: ram, raam, om, allah"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="row">
      <div style="flex: 1 1 100%;">
        <div class="field-label">Recognition language</div>

        <select id="languageSelect">
          <option value="hi-IN">Hindi - India</option>
          <option value="en-IN">English - India</option>
          <option value="en-US">English - US</option>
        </select>
      </div>
    </div>

    <div class="pill" id="supportPill">
      <span class="pill-dot"></span>
      <span id="supportText">Speech ready</span>
    </div>

    <div class="count-box">
      <div class="count-label">Total Jap Count</div>

      <div class="count-value" id="countDisplay">0</div>

      <div class="count-note" id="mantraPreview">
        Counting: "ram", "raam"
      </div>
    </div>

    <div class="btn-row">
      <button id="startBtn" class="btn btn-primary" type="button">
        <span id="startIcon">▶</span>
        <span id="startLabel">Start Listening</span>
      </button>

      <button id="stopBtn" class="btn btn-stop" type="button" disabled>
        ■ Stop
      </button>

      <button id="resetBtn" class="btn btn-secondary" type="button">
        Reset
      </button>
    </div>

    <div class="status" id="statusText"></div>

    <div class="field-label">Latest suna hua text</div>

    <div class="transcript-box" id="transcriptBox">
      <span class="transcript-placeholder">
        Yaha last suna hua sentence dikhega…
      </span>
    </div>

    <div class="tagline">
      Tip: Page reload ke baad bhi count safe rahega ✨
    </div>
  </div>

  <script>
    // DOM elements
    const mantraInput = document.getElementById("mantraInput");
    const languageSelect = document.getElementById("languageSelect");
    const supportText = document.getElementById("supportText");
    const supportPill = document.getElementById("supportPill");
    const countDisplay = document.getElementById("countDisplay");
    const mantraPreview = document.getElementById("mantraPreview");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const startIcon = document.getElementById("startIcon");
    const startLabel = document.getElementById("startLabel");
    const resetBtn = document.getElementById("resetBtn");
    const statusText = document.getElementById("statusText");
    const transcriptBox = document.getElementById("transcriptBox");
    const themeToggle = document.getElementById("themeToggle");

    // Speech Recognition setup
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let listening = false;
    let totalCount = 0;
    let targetWords = [];
    let userStopped = true;
    let finalTranscript = "";
    let countedResultIndexes = new Set();

    // Load saved count
    const savedCount = localStorage.getItem("japCount");

    if (savedCount !== null) {
      const parsedCount = parseInt(savedCount, 10);

      if (!Number.isNaN(parsedCount) && parsedCount >= 0) {
        totalCount = parsedCount;
        countDisplay.textContent = String(totalCount);
      }
    }

    // Load saved language
    const savedLanguage = localStorage.getItem("japLanguage");

    if (savedLanguage) {
      languageSelect.value = savedLanguage;
    }

    languageSelect.addEventListener("change", () => {
      localStorage.setItem("japLanguage", languageSelect.value);

      if (recognition && !listening) {
        recognition.lang = languageSelect.value;
      }

      statusText.classList.remove("status-error");
      statusText.textContent =
        `Language selected: ${languageSelect.options[
          languageSelect.selectedIndex
        ].text}`;
    });

    // Load theme
    if (localStorage.getItem("japTheme") === "dark") {
      document.body.classList.add("dark");
      themeToggle.textContent = "☀️ Light";
    }

    themeToggle.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");

      localStorage.setItem("japTheme", isDark ? "dark" : "light");
      themeToggle.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    });

    function updateTargetWords() {
      const raw = mantraInput.value || "";

      targetWords = raw
        .split(",")
        .map((word) => word.trim().toLowerCase())
        .filter(Boolean);

      if (targetWords.length === 0) {
        mantraPreview.textContent =
          "No mantra set - please enter at least one.";
      } else {
        mantraPreview.textContent =
          'Counting: "' + targetWords.join('", "') + '"';
      }
    }

    function setListeningState(isOn) {
      listening = isOn;

      if (isOn) {
        startBtn.disabled = true;
        startBtn.classList.add("disabled");
        stopBtn.disabled = false;
        startIcon.textContent = "●";
        startLabel.textContent = "Listening...";
        supportText.textContent = "Mic active";
        statusText.textContent = "Sunn raha hoon… jap bolo.";
      } else {
        startBtn.disabled = false;
        startBtn.classList.remove("disabled");
        stopBtn.disabled = true;
        startIcon.textContent = "▶";
        startLabel.textContent = "Start Listening";
        supportText.textContent = "Speech ready";
      }
    }

    function showTranscript(text) {
      transcriptBox.textContent = text;
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    function resetTranscriptPlaceholder() {
      transcriptBox.innerHTML = "";

      const span = document.createElement("span");
      span.className = "transcript-placeholder";
      span.textContent =
        "Yaha last suna hua sentence dikhega…";

      transcriptBox.appendChild(span);
    }

    function normalizeText(text) {
      return text
        .toLowerCase()
        .replace(/[।,.;:!?()[\]{}"'`]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function countOccurrences(text, targetList) {
      const tokens = normalizeText(text)
        .split(" ")
        .filter(Boolean);

      return tokens.filter((token) =>
        targetList.includes(token)
      ).length;
    }

    function showUnsupportedMessage() {
      supportText.textContent =
        "⚠ Speech support available nahi hai";

      supportPill.classList.add("pill-error");

      statusText.classList.add("status-error");
      statusText.textContent =
        "SpeechRecognition ke liye Chrome ya Edge use karo.";

      startBtn.disabled = true;
      startBtn.classList.add("disabled");
      stopBtn.disabled = true;
    }

    function setupRecognition() {
      if (!SpeechRecognition) {
        showUnsupportedMessage();
        return;
      }

      recognition = new SpeechRecognition();

      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.lang = languageSelect.value;

      recognition.onstart = () => {
        setListeningState(true);
        supportPill.classList.remove("pill-error");
        statusText.classList.remove("status-error");
      };

      recognition.onend = () => {
        listening = false;

        startBtn.disabled = false;
        startBtn.classList.remove("disabled");
        stopBtn.disabled = true;

        startIcon.textContent = "▶";
        startLabel.textContent = "Start Listening";

        if (!userStopped) {
          supportText.textContent = "Reconnecting...";

          setTimeout(() => {
            if (userStopped || listening) {
              return;
            }

            try {
              recognition.start();
            } catch (error) {
              if (error.name !== "InvalidStateError") {
                console.error("Restart error:", error);
              }
            }
          }, 300);
        } else {
          supportText.textContent = "Speech ready";
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech error:", event.error);

        statusText.classList.add("status-error");

        if (
          event.error === "not-allowed" ||
          event.error === "service-not-allowed"
        ) {
          statusText.textContent =
            "Mic permission allow karo, phir dobara Start dabao.";
          userStopped = true;
        } else if (event.error === "no-speech") {
          statusText.textContent =
            "Koi speech detect nahi hui. Dobara bolkar dekhein.";
        } else if (event.error === "audio-capture") {
          statusText.textContent =
            "Microphone available nahi hai.";
          userStopped = true;
        } else if (event.error === "network") {
          statusText.textContent =
            "Speech service/network error.";
        } else {
          statusText.textContent =
            "Speech error: " + event.error;
        }
      };

      recognition.onresult = (event) => {
        let interimTranscript = "";
        let added = 0;

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          const transcript = result[0].transcript.trim();

          if (result.isFinal) {
            if (!countedResultIndexes.has(i)) {
              added += countOccurrences(
                transcript,
                targetWords
              );

              countedResultIndexes.add(i);
            }

            finalTranscript += transcript + " ";
          } else {
            interimTranscript += transcript + " ";
          }
        }

        const visibleTranscript =
          (finalTranscript + interimTranscript).trim();

        if (visibleTranscript) {
          showTranscript(visibleTranscript);
        }

        if (added > 0) {
          totalCount += added;

          countDisplay.textContent = String(totalCount);
          localStorage.setItem(
            "japCount",
            String(totalCount)
          );

          statusText.classList.remove("status-error");
          statusText.textContent =
            `+${added} jap detect hua. Total: ${totalCount}`;
        }
      };
    }

    mantraInput.addEventListener("input", () => {
      updateTargetWords();

      if (listening) {
        statusText.textContent =
          "Mantra list update ho gayi.";
      }
    });

    startBtn.addEventListener("click", () => {
      if (!recognition) {
        setupRecognition();
      }

      if (!recognition) {
        return;
      }

      updateTargetWords();

      if (targetWords.length === 0) {
        statusText.classList.add("status-error");
        statusText.textContent =
          "Pehle mantra likho.";
        return;
      }

      recognition.lang = languageSelect.value;
      userStopped = false;
      finalTranscript = "";
      countedResultIndexes.clear();

      resetTranscriptPlaceholder();

      try {
        recognition.start();
      } catch (error) {
        if (error.name === "InvalidStateError") {
          statusText.textContent =
            "Recognition already running hai.";
        } else {
          console.error("Start error:", error);
          statusText.textContent =
            "Recognition start nahi ho saka.";
        }
      }
    });

    stopBtn.addEventListener("click", () => {
      userStopped = true;

      if (recognition && listening) {
        try {
          recognition.stop();
        } catch (error) {
          console.warn("Stop error:", error);
        }
      }

      setListeningState(false);
      statusText.classList.remove("status-error");
      statusText.textContent = "Listening stopped.";
    });

    resetBtn.addEventListener("click", () => {
      totalCount = 0;
      finalTranscript = "";
      countedResultIndexes.clear();

      countDisplay.textContent = "0";
      localStorage.removeItem("japCount");

      resetTranscriptPlaceholder();

      statusText.classList.remove("status-error");
      statusText.textContent =
        "Reset kar diya. Naya jap shuru kar sakte ho.";
    });

    // Initial setup
    updateTargetWords();
    resetTranscriptPlaceholder();
    setupRecognition();
  </script>
</body>
</html>
