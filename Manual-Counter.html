<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#6d28d9"
  />

  <title>Manual Jap Counter</title>

  <link
    rel="manifest"
    href="./manifest.json"
  />

  <link
    rel="stylesheet"
    href="./style.css"
  />

  <style>
    .manual-page {
      min-height: 100vh;
      padding: 24px 16px;
    }

    .manual-wrap {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    .manual-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .back-link {
      color: inherit;
      text-decoration: none;
      opacity: 0.8;
    }

    .manual-card {
      padding: 24px 18px;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      background: var(--card-bg);
      text-align: center;
    }

    .manual-label {
      margin: 0 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    .manual-card h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .manual-description {
      margin: 10px auto 24px;
      max-width: 360px;
      line-height: 1.5;
      opacity: 0.72;
    }

    .manual-total {
      margin: 20px 0;
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: 800;
      line-height: 1;
    }

    .manual-tap-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 300px);
      min-height: 64px;
      padding: 14px 22px;
      border: 0;
      border-radius: 18px;
      background: #6d28d9;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px
        rgba(109, 40, 217, 0.25);
      touch-action: manipulation;
    }

    .manual-tap-button:active {
      transform: scale(0.97);
    }

    .manual-tap-button:focus-visible,
    .manual-small-button:focus-visible,
    .back-link:focus-visible {
      outline: 3px solid
        rgba(109, 40, 217, 0.45);
      outline-offset: 4px;
    }

    .manual-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .manual-small-button {
      min-width: 100px;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .manual-feedback {
      min-height: 20px;
      margin: 16px 0 0;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    .manual-note {
      margin: 22px 0 0;
      font-size: 0.8rem;
      line-height: 1.5;
      opacity: 0.58;
    }
  </style>
</head>

<body>
  <main class="manual-page">
    <div class="manual-wrap">
      <div class="manual-topbar">
        <a
          class="back-link"
          href="./index.html"
        >
          ← Voice counter
        </a>

        <button
          id="themeButton"
          class="manual-small-button"
          type="button"
        >
          Theme
        </button>
      </div>

      <section
        class="manual-card"
        aria-labelledby="manualTitle"
      >
        <p class="manual-label">
          Secondary counter
        </p>

        <h1 id="manualTitle">
          Manual Jap Counter
        </h1>

        <p class="manual-description">
          Voice recognition use nahi karna ho to
          har jap ke baad button tap karein.
        </p>

        <div
          id="manualTotal"
          class="manual-total"
          aria-live="polite"
        >
          0
        </div>

        <button
          id="manualTapButton"
          class="manual-tap-button"
          type="button"
        >
          <span aria-hidden="true">＋</span>
          <span>Add 1 Jap</span>
        </button>

        <div class="manual-actions">
          <button
            id="manualUndoButton"
            class="manual-small-button"
            type="button"
          >
            Undo
          </button>

          <button
            id="manualResetButton"
            class="manual-small-button"
            type="button"
          >
            Reset
          </button>
        </div>

        <p
          id="manualFeedback"
          class="manual-feedback"
          aria-live="polite"
        ></p>

        <p class="manual-note">
          Manual count aaj ke voice count ke saath
          same daily history mein save hoga.
        </p>
      </section>
    </div>
  </main>

  <script>
    "use strict";

    const HISTORY_KEY = "japHistory";
    const THEME_KEY = "japTheme";

    const totalElement =
      document.getElementById(
        "manualTotal"
      );

    const tapButton =
      document.getElementById(
        "manualTapButton"
      );

    const undoButton =
      document.getElementById(
        "manualUndoButton"
      );

    const resetButton =
      document.getElementById(
        "manualResetButton"
      );

    const feedbackElement =
      document.getElementById(
        "manualFeedback"
      );

    const themeButton =
      document.getElementById(
        "themeButton"
      );

    let manualSessionCount = 0;

    function todayKey() {
      const date = new Date();

      return (
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          date.getDate()
        ).padStart(2, "0")
      );
    }

    function readHistory() {
      try {
        const saved =
          localStorage.getItem(
            HISTORY_KEY
          );

        const parsed = saved
          ? JSON.parse(saved)
          : {};

        return parsed &&
          typeof parsed === "object" &&
          !Array.isArray(parsed)
          ? parsed
          : {};
      } catch (error) {
        return {};
      }
    }

    function saveHistory(history) {
      localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
      );
    }

    function getTodayTotal() {
      const history = readHistory();

      return Number(
        history[todayKey()]
      ) || 0;
    }

    function updateDisplay(message) {
      totalElement.textContent =
        String(getTodayTotal());

      if (message) {
        feedbackElement.textContent =
          message;
      }
    }

    function addJap() {
      const history = readHistory();
      const key = todayKey();

      history[key] =
        (Number(history[key]) || 0) + 1;

      manualSessionCount++;

      saveHistory(history);
      updateDisplay("Added 1 jap.");
    }

    function undoJap() {
      if (manualSessionCount <= 0) {
        feedbackElement.textContent =
          "Is manual session mein undo karne ke liye count nahi hai.";
        return;
      }

      const history = readHistory();
      const key = todayKey();

      const current =
        Number(history[key]) || 0;

      if (current > 0) {
        history[key] =
          Math.max(0, current - 1);
      }

      manualSessionCount--;

      saveHistory(history);
      updateDisplay("Last manual jap removed.");
    }

    function resetManualSession() {
      const removeCount =
        manualSessionCount;

      if (removeCount <= 0) {
        feedbackElement.textContent =
          "Is session mein reset karne ke liye count nahi hai.";
        return;
      }

      const confirmed =
        window.confirm(
          "Is manual session ke " +
            removeCount +
            " jap remove karne hain?"
        );

      if (!confirmed) {
        return;
      }

      const history = readHistory();
      const key = todayKey();

      const current =
        Number(history[key]) || 0;

      history[key] =
        Math.max(
          0,
          current - removeCount
        );

      manualSessionCount = 0;

      saveHistory(history);
      updateDisplay("Manual session reset.");
    }

    function loadTheme() {
      const dark =
        localStorage.getItem(
          THEME_KEY
        ) === "dark";

      if (dark) {
        document.body.classList.add(
          "dark"
        );
      }

      themeButton.textContent =
        dark
          ? "☀️ Light"
          : "🌙 Dark";
    }

    function toggleTheme() {
      const dark =
        document.body.classList.toggle(
          "dark"
        );

      localStorage.setItem(
        THEME_KEY,
        dark ? "dark" : "light"
      );

      themeButton.textContent =
        dark
          ? "☀️ Light"
          : "🌙 Dark";
    }

    tapButton.addEventListener(
      "click",
      addJap
    );

    undoButton.addEventListener(
      "click",
      undoJap
    );

    resetButton.addEventListener(
      "click",
      resetManualSession
    );

    themeButton.addEventListener(
      "click",
      toggleTheme
    );

    loadTheme();
    updateDisplay();
  </script>
</body>
</html>
